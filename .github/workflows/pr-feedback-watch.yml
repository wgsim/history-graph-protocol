name: Notify maintainer of PR feedback

on:
  schedule:
    - cron: '9,24,39,54 * * * *'
  workflow_dispatch:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: pr-feedback-watch
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      github.repository == 'wgsim/history-graph-protocol' &&
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issue_comment' && github.event.issue.pull_request) ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Always run the script from the trusted branch, never the PR checkout.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Notify the maintainer of new feedback
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/watch_pr_feedback.py
